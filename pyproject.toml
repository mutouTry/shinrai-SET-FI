[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "setfi"
version = "0.1.0"
description = "Timing-aware single-event-transient (SET) fault-injection analysis for gate-level netlists"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.20",
  "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
setfi = "setfi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
